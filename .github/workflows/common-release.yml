name: Common Release Workflow

# Reusable release pipeline, parameterized per product.
#   product      npm package name  (skyflow-node | skyflow-flowvault-node)
#   package-dir  workspace dir      (skyvault     | flowvault)
#   release-type public | beta | internal
#   version      semver to release  (caller strips any tag prefix, e.g. flowvault/1.0.0 -> 1.0.0)

on:
  workflow_call:
    inputs:
      product:
        required: true
        type: string
      package-dir:
        required: true
        type: string
      release-type:
        required: true
        type: string
      version:
        required: false
        type: string

jobs:
  build-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_ACTIONS }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: "https://registry.npmjs.org"

      - name: Install Packages
        run: npm install --ignore-scripts

      - name: Resolve Version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "value=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            # Fallback: strip an optional "<dir>/" prefix from the pushed tag.
            echo "value=${GITHUB_REF_NAME##*/}" >> $GITHUB_OUTPUT
          fi

      - name: Bump Version (${{ inputs.product }})
        run: |
          chmod +x ./scripts/bump_version.sh
          if [[ "${{ inputs.release-type }}" == "internal" ]]; then
            ./scripts/bump_version.sh "${{ inputs.product }}" "${{ steps.version.outputs.value }}" "$(git rev-parse --short "$GITHUB_SHA")"
          else
            ./scripts/bump_version.sh "${{ inputs.product }}" "${{ steps.version.outputs.value }}"
          fi

      # Build everything (common -> layers) then bundle the published package
      # (inlines skyflow-common into a self-contained dist/).
      - name: Build
        run: |
          npm run build
          npm run build:dist --workspace ${{ inputs.package-dir }}

      - name: Resolve Branch Name
        id: resolve-branch
        if: ${{ inputs.release-type == 'beta' || inputs.release-type == 'public' }}
        run: |
          TAG_COMMIT=$(git rev-list -n 1 ${{ github.ref_name }})
          BRANCH_NAME=$(git branch -r --contains $TAG_COMMIT | grep -o 'origin/.*' | sed 's|origin/||' | head -n 1)
          if [ -z "$BRANCH_NAME" ]; then
            echo "Error: Could not resolve branch for the tag."
            exit 1
          fi
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_ENV

      # Only public/beta record the released version back on the source branch.
      # Internal (JFrog) builds publish the bumped working tree directly and do
      # NOT push back: the branch needs no mutation, pushing would need write
      # access to the release branch, and src/version.ts is not path-ignored so
      # a push-back would re-trigger this workflow in a loop.
      - name: Commit Changes
        if: ${{ inputs.release-type == 'beta' || inputs.release-type == 'public' }}
        run: |
          git config user.name ${{ github.actor }}
          git config user.email ${{ github.actor }}@users.noreply.github.com
          git checkout ${{ env.branch_name }}
          git add ${{ inputs.package-dir }}/package.json ${{ inputs.package-dir }}/src/version.ts
          git commit -m "[AUTOMATED] Release ${{ inputs.product }} - ${{ steps.version.outputs.value }}" || echo "nothing to commit"
          git push origin ${{ env.branch_name }}

      - name: Publish
        working-directory: ${{ inputs.package-dir }}
        run: |
          if [[ "${{ inputs.release-type }}" == "beta" ]]; then
            npm publish --tag beta
          elif [[ "${{ inputs.release-type }}" == "public" ]]; then
            npm publish
          elif [[ "${{ inputs.release-type }}" == "internal" ]]; then
            # Publish to the internal JFrog registry. npm ignores a workspace
            # member's own .npmrc and `npm config set` can't run inside a
            # workspace dir (ENOWORKSPACES), so pass the registry on the command
            # line and add its auth to the workspace-root .npmrc that npm reads.
            JFROG_AUTH=$(echo -n "$JFROG_USERNAME:$JFROG_PASSWORD" | base64 -w 0)
            echo "//prekarilabs.jfrog.io/prekarilabs/api/npm/npm/:_auth=${JFROG_AUTH}" >> "$GITHUB_WORKSPACE/.npmrc"
            npm publish --registry https://prekarilabs.jfrog.io/prekarilabs/api/npm/npm/
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          JFROG_USERNAME: ${{ secrets.JFROG_USERNAME }}
          JFROG_PASSWORD: ${{ secrets.JFROG_PASSWORD }}
