name: Internal Release

# Branch-namespaced internal (JFrog) builds, routed per product:
#   flowvault-release/*            -> skyflow-flowvault-node
#   skyvault-release/* | release/* -> skyflow-node (legacy release/* kept for skyvault)
#
# Branch pushes only. A `tags-ignore` filter used to live here, but with one
# present GitHub runs the workflow for every tag it does NOT match, and its
# single-star pattern never matched prefixed tags such as flowvault/1.0.0, so a
# public release tag also fired an internal build. With only `branches` set,
# tag pushes never trigger this workflow.
on:
  push:
    paths-ignore:
      - 'package.json'
      - 'package-lock.json'
      - '*.md'
    branches:
      - release/*
      - skyvault-release/*
      - flowvault-release/*

jobs:
  call-common-workflow:
    # Belt and braces: never run for a tag ref, whatever the trigger says.
    if: startsWith(github.ref, 'refs/heads/')
    uses: ./.github/workflows/common-release.yml
    with:
      product: ${{ startsWith(github.ref_name, 'flowvault-release/') && 'skyflow-flowvault-node' || 'skyflow-node' }}
      package-dir: ${{ startsWith(github.ref_name, 'flowvault-release/') && 'flowvault' || 'skyvault' }}
      release-type: internal
    secrets: inherit
