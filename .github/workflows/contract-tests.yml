name: Contract Tests

on:
  pull_request:
    branches:
      - main
      - release/*

jobs:
  contract-tests:
    name: Contract Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Builds every package, bundles the two published dist/ surfaces, then
      # verifies BOTH SDKs' public-API snapshots (skyflow-node + skyflow-flowvault-node).
      - name: Verify API surface snapshots (both SDKs)
        run: npm run contract-snapshot-verify

      - name: Show API surface diff
        if: failure()
        run: |
          echo "### API surface changes detected ###"
          echo "Lines prefixed with '-' were REMOVED from the public API."
          echo "Lines prefixed with '+' were ADDED to the public API."
          echo ""
          echo "===== skyflow-node (skyvault) ====="
          diff -u skyvault/api-report/skyflow-node.api.md skyvault/temp/skyflow-node.api.md || true
          echo ""
          echo "===== skyflow-flowvault-node (flowvault) ====="
          diff -u flowvault/api-report/skyflow-flowvault-node.api.md flowvault/temp/skyflow-flowvault-node.api.md || true

      - name: Upload API surface diffs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: api-surface-diffs
          path: |
            skyvault/temp/skyflow-node.api.md
            flowvault/temp/skyflow-flowvault-node.api.md
          retention-days: 7
