name: Contract Tests

on:
  pull_request:
    branches:
      - main
      - release/*

permissions:
  contents: read
  pull-requests: write

jobs:
  contract-tests:
    name: Contract Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The base branch's committed api-report is the "before" side of the
      # public-API diff posted on the PR.
      - name: Fetch base branch
        run: git fetch --no-tags --depth=1 origin "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Builds every package, bundles the two published dist/ surfaces, then
      # verifies BOTH SDKs' public-API snapshots (skyflow-node + skyflow-flowvault-node).
      # The snapshots include the shared skyflow-common surface, so a change in
      # common/ fails here too. Fails if the committed api-report is out of date.
      - name: Verify API surface snapshots (both SDKs)
        id: verify
        run: npm run contract-snapshot-verify

      # Runs whether or not the snapshot check passed, so every PR gets a
      # comment showing exactly what changed in the public API relative to the
      # base branch (a snapshot that was re-baselined in the PR still passes the
      # check above, but reviewers still need to see the change).
      - name: Diff API surface against base branch
        if: always()
        run: |
          bash .github/scripts/api-surface-diff.sh "origin/${{ github.base_ref }}" api-surface-diff.md
          cat api-surface-diff.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post API surface diff on the PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- api-surface-diff -->';
            const body = fs.readFileSync('api-surface-diff.md', 'utf8');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            try {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number, per_page: 100,
              });
              const existing = comments.find(c => c.body && c.body.includes(marker));
              if (existing) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number, body });
              }
            } catch (err) {
              // Forked PRs run with a read-only token; the diff is still in the job summary.
              core.warning(`Could not post the API surface comment: ${err.message}`);
            }

      - name: Show snapshot mismatch
        if: failure()
        run: |
          echo "### Committed API snapshot does not match the built API ###"
          echo "If this change is intended, run 'npm run contract-snapshot' and commit the updated api-report files."
          echo ""
          echo "===== skyflow-node (skyvault) ====="
          diff -u skyvault/api-report/skyflow-node.api.md skyvault/temp/skyflow-node.api.md || true
          echo ""
          echo "===== skyflow-flowvault-node (flowvault) ====="
          diff -u flowvault/api-report/skyflow-flowvault-node.api.md flowvault/temp/skyflow-flowvault-node.api.md || true

      - name: Upload API surface reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-surface-reports
          path: |
            api-surface-diff.md
            skyvault/temp/skyflow-node.api.md
            flowvault/temp/skyflow-flowvault-node.api.md
          retention-days: 7
          if-no-files-found: ignore
