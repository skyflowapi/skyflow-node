name: Public Beta Release

on:
  push:
    tags: '*.*.*-beta.*'
    paths-ignore:
      - "package.json"
      - "package-lock.json"
      - "*.md"

jobs:
  build-and-deploy:
    uses: ./.github/workflows/common-release.yml
    with:
      product: skyflow-node
      package-dir: skyvault
      release-type: beta
    secrets: inherit
